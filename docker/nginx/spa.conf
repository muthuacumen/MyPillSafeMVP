server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API calls straight to the backend so this container also works
    # standalone (docker-compose.yml exposes it directly on :5173, separate
    # from the :80 gateway which does the same routing at the top level).
    # The frontend's baseURL defaults to a relative /api/v1 path, so without
    # this block every API call would 404 against try_files below instead of
    # reaching the backend.
    location ~ ^/(api|docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # All routes → index.html (React Router handles it)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
