# ──────────────────────────────────────────────────────────────────────────────
# mypillsafe.ca — HOST nginx site config for the DigitalOcean droplet
# (Task A5.2). This is NOT a container config -- it belongs at
# /etc/nginx/sites-available/mypillsafe.ca.conf on the droplet itself
# (symlinked into sites-enabled), sitting in FRONT of the dockerized gateway
# nginx from docker-compose.prod.yml, which listens on 127.0.0.1:8080 only.
#
# The droplet already serves two other live sites through this same host
# nginx (JidokaAcumen, PathoIntern QA) -- this file only claims the
# mypillsafe.ca / www.mypillsafe.ca server_name, it does not touch theirs.
#
# Plain HTTP only for now. Part B runs certbot against this file, which
# rewrites it in place to add the TLS server block + HTTP->HTTPS redirect
# (certbot --nginx). Do not hand-add TLS directives here -- let certbot own
# that edit so its renewal hooks keep matching what's actually on disk.
# ──────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name mypillsafe.ca www.mypillsafe.ca;

    # Phone photos (prescription labels, pill scans) run 3-5 MB -- nginx's
    # 1M default would reject them outright. The containerized gateway
    # nginx already sets the same 20M limit (docker/nginx/nginx.conf:23);
    # match it here so the HOST proxy doesn't become the tighter ceiling.
    client_max_body_size 20M;

    # Must clear a full OCR round-trip (sidecar subprocess spawn + PaddleOCR
    # model load + inference -- measured ~10-45s on GPU per label, see Task
    # A1's verification bar #4) plus the pill-scan pipeline (IMB1+SB2, up to
    # 180s client-side timeout in app/api/v1/routes/pill.py). 300s covers
    # both with headroom.
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-safe (harmless no-op today; the SPA doesn't use one, but
        # costs nothing to keep the proxy transparent to future Vite HMR /
        # push-style features).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
