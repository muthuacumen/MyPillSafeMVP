<rect width="2100" height="1485" fill="#FFFFFF"/>
<text x="40" y="62" class="ti">Answer Voice (CB4) — Component Diagram (C4 level 3)</text>
<text x="40" y="100" class="su">How a guarded, cited answer is generated in the patient's own language — and exactly what crosses the one boundary that leaves our network.</text>
<rect x="440" y="125" width="880" height="749" rx="5" fill="none" stroke="#9AA4AD" stroke-width="1.6" stroke-dasharray="9 6"/>
<text x="458" y="153" class="bd">Droplet — public internet, mypillsafe.ca</text>
<rect x="1520" y="125" width="540" height="675" rx="5" fill="none" stroke="#9AA4AD" stroke-width="1.6" stroke-dasharray="9 6"/>
<text x="1538" y="153" class="bd">Brains Host — private network, GPU, never public</text>
<rect x="40" y="340" width="210" height="280" rx="4" fill="#8B99A6" stroke="#6F7C87" stroke-width="1.8"/>
<text x="145.0" y="397.5" class="nm">Patient</text>
<text x="145.0" y="430.5" class="tp">[Person]</text>
<text x="145.0" y="457.5" class="ds">Asks a medication</text>
<text x="145.0" y="478.5" class="ds">question, and picks</text>
<text x="145.0" y="499.5" class="ds">the language the</text>
<text x="145.0" y="520.5" class="ds">answer comes</text>
<text x="145.0" y="541.5" class="ds">back in: English,</text>
<text x="145.0" y="562.5" class="ds">French, Spanish,</text>
<text x="145.0" y="583.5" class="ds">Arabic or Tamil</text>
<rect x="460" y="175" width="840" height="670" rx="4" fill="#1E3A5F" stroke="#16293F" stroke-width="1.8"/>
<text x="880.0" y="207" class="nm">API</text>
<text x="880.0" y="240" class="tp">[Container: FastAPI, Python]</text>
<text x="880.0" y="267" class="ds">Owns the Q&amp;A route, the prompt contract, the retry loop and the only cloud key</text>
<rect x="1540" y="175" width="500" height="130" rx="4" fill="#1E3A5F" stroke="#16293F" stroke-width="1.8"/>
<text x="1790.0" y="210.0" class="nm">Local Language Model</text>
<text x="1790.0" y="243.0" class="tp">[Container: Ollama, qwen2.5:7b-instruct]</text>
<text x="1790.0" y="270.0" class="ds">BB3's own generator — the offline</text>
<text x="1790.0" y="291.0" class="ds">fallback, and never the production voice.</text>
<rect x="1540" y="345" width="500" height="415" rx="4" fill="#1E3A5F" stroke="#16293F" stroke-width="1.8"/>
<text x="1790.0" y="422.5" class="nm">BB3 — Monograph Retrieval</text>
<text x="1790.0" y="455.5" class="tp">[Container: the frozen bb3 package,</text>
<text x="1790.0" y="474.5" class="tp">on the brains sidecar]</text>
<text x="1790.0" y="501.5" class="ds">Resolves the question to Canadian DINs —</text>
<text x="1790.0" y="522.5" class="ds">or asks, when it cannot: confirm,</text>
<text x="1790.0" y="543.5" class="ds">pick_list, not_found. Retrieves only</text>
<text x="1790.0" y="564.5" class="ds">those monographs' passages and packs</text>
<text x="1790.0" y="585.5" class="ds">them with their source tags.</text>
<text x="1790.0" y="616.5" class="an">It resolves, retrieves and checks. It</text>
<text x="1790.0" y="634.5" class="an">does not speak: generation moved out</text>
<text x="1790.0" y="652.5" class="an">after its local 7B answered the opposite</text>
<text x="1790.0" y="670.5" class="an">of a contraindication it had itself cited.</text>
<text x="1790.0" y="688.5" class="an">/qa/guard runs the same four checks on</text>
<text x="1790.0" y="706.5" class="an">CB4's answer that it ran on its own.</text>
<rect x="440" y="900" width="560" height="290" rx="4" fill="#8B99A6" stroke="#D64045" stroke-width="4"/>
<text x="720.0" y="962.0" class="nm">Claude API</text>
<text x="720.0" y="995.0" class="tp">[External system: Anthropic, claude-haiku-4-5]</text>
<text x="720.0" y="1022.0" class="ds">Phrases the answer from the passages it is</text>
<text x="720.0" y="1043.0" class="ds">handed, in the language it is told to use.</text>
<text x="720.0" y="1064.0" class="ds">It retrieves nothing, holds no tools, and</text>
<text x="720.0" y="1085.0" class="ds">decides nothing.</text>
<text x="720.0" y="1116.0" class="an">The one and only cloud call in MyPillSafe.</text>
<text x="720.0" y="1134.0" class="an">Every other model on this page runs on</text>
<text x="720.0" y="1152.0" class="an">hardware the project owns.</text>
<rect x="480" y="275" width="800" height="125" rx="4" fill="#2A9D8F" stroke="#1F7A6E" stroke-width="1.8"/>
<text x="880.0" y="293.0" class="cn">Q&amp;A Route</text>
<text x="880.0" y="322.0" class="ct">[Component: POST /api/v1/qa/chat — patient-scoped, authenticated]</text>
<text x="880.0" y="348.0" class="cd">A configured key selects the cloud voice and BB3's context mode; with no key the request</text>
<text x="880.0" y="368.0" class="cd">falls through to the sidecar's own local 7B and the answer is marked voice="local_7b".</text>
<text x="880.0" y="398.0" class="anc">The patient is authenticated here — and nothing that identifies them travels any further.</text>
<rect x="480" y="410" width="800" height="125" rx="4" fill="#2A9D8F" stroke="#1F7A6E" stroke-width="1.8"/>
<text x="880.0" y="428.0" class="cn">Prompt Contract</text>
<text x="880.0" y="457.0" class="ct">[Component: cb4_service.SYSTEM_PROMPT_TEMPLATE — a fixed constant, never assembled per call]</text>
<text x="880.0" y="483.0" class="cd">Seven rules, numbered 1:1 against BB3's own template: answer only from the given sources,</text>
<text x="880.0" y="503.0" class="cd">cite every one used, never a dose from a generated reference, and preserve every polarity.</text>
<text x="880.0" y="533.0" class="anc">Rule 7 is the only variable part — it substitutes the language the patient picked in the app.</text>
<rect x="480" y="545" width="800" height="125" rx="4" fill="#2A9D8F" stroke="#1F7A6E" stroke-width="1.8"/>
<text x="880.0" y="563.0" class="cn">The Claude Call</text>
<text x="880.0" y="592.0" class="ct">[Component: cb4_service._call_claude — model claude-haiku-4-5]</text>
<text x="880.0" y="618.0" class="cd">One user message per turn: BB3's packed SOURCE SECTIONS, then the question. The reply is</text>
<text x="880.0" y="638.0" class="cd">forced into a JSON schema, and any source tag BB3 did not offer is dropped from it.</text>
<text x="880.0" y="668.0" class="anc">A failed call or an unparseable reply returns nothing, which the loop below treats as a retry.</text>
<rect x="480" y="680" width="800" height="145" rx="4" fill="#2A9D8F" stroke="#1F7A6E" stroke-width="1.8"/>
<text x="880.0" y="698.0" class="cn">Guard Retry Protocol</text>
<text x="880.0" y="727.0" class="ct">[Component: cb4_service.answer_question — mirrors bb3.guards.check_and_fix]</text>
<text x="880.0" y="753.0" class="cd">Entity, then ingredient consistency, then polarity: each violation earns one corrective</text>
<text x="880.0" y="773.0" class="cd">retry and one re-check. Fail the same guard twice and the draft is discarded, not patched.</text>
<text x="880.0" y="793.0" class="cd">A structural-abstention mismatch is flagged on the way out, and never retried.</text>
<text x="880.0" y="823.0" class="anc">The sidecar's /qa/guard is single-shot by design; this loop is the only place retry policy lives.</text>
<polyline points="250,400 460,400" fill="none" stroke="#7A8894" stroke-width="2.1" marker-end="url(#ah)"/>
<rect x="284.4" y="333" width="141.2" height="47.6" fill="#FFFFFF"/>
<text x="355" y="348.0" class="el">Asks a question</text>
<text x="355" y="368.8" class="el">[HTTPS]</text>
<circle cx="282" cy="400" r="14" fill="#1E3A5F" stroke="#FFFFFF" stroke-width="2"/>
<text x="282" y="406" class="bg">1</text>
<polyline points="460,500 250,500" fill="none" stroke="#7A8894" stroke-width="2.1" marker-end="url(#ah)"/>
<rect x="271.68" y="433" width="166.64000000000001" height="47.6" fill="#FFFFFF"/>
<text x="355" y="448.0" class="el">The answer, cited,</text>
<text x="355" y="468.8" class="el">in their language</text>
<circle cx="428" cy="500" r="14" fill="#1E3A5F" stroke="#FFFFFF" stroke-width="2"/>
<text x="428" y="506" class="bg">5</text>
<polyline points="1300,380 1540,380" fill="none" stroke="#7A8894" stroke-width="2.1" marker-end="url(#ah)"/>
<rect x="1357.88" y="313" width="124.24000000000001" height="47.6" fill="#FFFFFF"/>
<text x="1420" y="328.0" class="el">POST /qa/chat</text>
<text x="1420" y="348.8" class="el">mode=context</text>
<circle cx="1316" cy="380" r="14" fill="#1E3A5F" stroke="#FFFFFF" stroke-width="2"/>
<text x="1316" y="386" class="bg">2</text>
<polyline points="1540,450 1300,450" fill="none" stroke="#7A8894" stroke-width="2.1" stroke-dasharray="8 6" marker-end="url(#ah)"/>
<rect x="1332.44" y="379" width="175.12" height="68.4" fill="#FFFFFF"/>
<text x="1420" y="394.0" class="el">context_ready — the</text>
<text x="1420" y="414.8" class="el">packed passages and</text>
<text x="1420" y="435.6" class="el">the JSON schema</text>
<polyline points="1300,700 1540,700" fill="none" stroke="#7A8894" stroke-width="2.1" marker-end="url(#ah)"/>
<rect x="1323.96" y="633" width="192.08" height="47.6" fill="#FFFFFF"/>
<text x="1420" y="648.0" class="el">POST /qa/guard —</text>
<text x="1420" y="668.8" class="el">BB3 checks the answer</text>
<circle cx="1316" cy="700" r="14" fill="#1E3A5F" stroke="#FFFFFF" stroke-width="2"/>
<text x="1316" y="706" class="bg">4</text>
<polyline points="1540,745 1300,745" fill="none" stroke="#7A8894" stroke-width="2.1" stroke-dasharray="8 6" marker-end="url(#ah)"/>
<rect x="1332.44" y="708" width="175.12" height="26.8" fill="#FFFFFF"/>
<text x="1420" y="723.0" class="el">violations, or none</text>
<polyline points="1790,345 1790,305" fill="none" stroke="#7A8894" stroke-width="2.1" marker-end="url(#ah)"/>
<rect x="1583.72" y="317" width="412.56" height="26.8" fill="#FFFFFF"/>
<text x="1790" y="332.0" class="el">offline fallback only — no cloud key configured</text>
<polyline points="700,845 700,900" fill="none" stroke="#D64045" stroke-width="2.6" marker-end="url(#ah_red)"/>
<rect x="782.76" y="877" width="234.48000000000002" height="26.8" fill="#FFFFFF"/>
<text x="900" y="892.0" class="elr">the one cloud call [HTTPS]</text>
<circle cx="700" cy="874" r="14" fill="#D64045" stroke="#FFFFFF" stroke-width="2"/>
<text x="700" y="880" class="bg">3</text>
<polyline points="760,900 760,845" fill="none" stroke="#D64045" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#ah_red)"/>
<rect x="1040" y="900" width="1020" height="290" rx="5" fill="#FDF8F1" stroke="#E09B3D" stroke-width="2"/>
<text x="1062" y="934" class="kt">What the request to Anthropic actually contains — and what has no field in it at all</text>
<text x="1062" y="964" class="kr">system  —  the seven fixed rules, rule 7 substituted to the language the patient chose</text>
<rect x="1975.48" y="950" width="62.52" height="19" rx="9.5" fill="#D64045"/>
<text x="2006.74" y="963" class="ch">CROSSES</text>
<text x="1062" y="988" class="kr">user  —  “SOURCE SECTIONS:” and BB3's packed passages, then “USER QUESTION:” and the typed text</text>
<rect x="1975.48" y="974" width="62.52" height="19" rx="9.5" fill="#D64045"/>
<text x="2006.74" y="987" class="ch">CROSSES</text>
<text x="1062" y="1012" class="kr">output_config  —  a JSON schema: answer, sources_used, abstained; additionalProperties false</text>
<rect x="1975.48" y="998" width="62.52" height="19" rx="9.5" fill="#D64045"/>
<text x="2006.74" y="1011" class="ch">CROSSES</text>
<text x="1062" y="1036" class="kr">on a retry  —  one corrective sentence naming the guard that fired, appended to the question</text>
<rect x="1975.48" y="1022" width="62.52" height="19" rx="9.5" fill="#D64045"/>
<text x="2006.74" y="1035" class="ch">CROSSES</text>
<text x="1062" y="1084" class="kr">who is asking  —  the route authenticates the patient, then forwards nothing that names them</text>
<rect x="1988.2" y="1070" width="49.8" height="19" rx="9.5" fill="#2E7D5B"/>
<text x="2013.1" y="1083" class="ch">STAYS</text>
<text x="1062" y="1108" class="kr">the medication profile  —  a DIN bypass reaches BB3 on our own network, never this request</text>
<rect x="1988.2" y="1094" width="49.8" height="19" rx="9.5" fill="#2E7D5B"/>
<text x="2013.1" y="1107" class="ch">STAYS</text>
<text x="1062" y="1132" class="kr">pill photos, prescription images, database rows  —  no such path reaches this service</text>
<rect x="1988.2" y="1118" width="49.8" height="19" rx="9.5" fill="#2E7D5B"/>
<text x="2013.1" y="1131" class="ch">STAYS</text>
<text x="1062" y="1156" class="kr">earlier turns  —  every call is one user message; nothing from a previous question is resent</text>
<rect x="1988.2" y="1142" width="49.8" height="19" rx="9.5" fill="#2E7D5B"/>
<text x="2013.1" y="1155" class="ch">STAYS</text>
<text x="1062" y="1188" class="kf">Four fields go out. Who is asking has no field at all — the request's shape, not a policy.</text>
<rect x="40.0" y="1215" width="653.3333333333334" height="100" rx="4" fill="#F7F9FB" stroke="#D8E0E7" stroke-width="1.4"/>
<text x="58.0" y="1243" class="nt">BB3 retrieves and checks; CB4 speaks</text>
<text x="58.0" y="1269" class="nb">Generation moved out of BB3 after its local 7B answered the opposite of a</text>
<text x="58.0" y="1291" class="nb">contraindication it had itself cited. The guards that caught it run here.</text>
<rect x="723.3333333333334" y="1215" width="653.3333333333334" height="100" rx="4" fill="#F7F9FB" stroke="#D8E0E7" stroke-width="1.4"/>
<text x="741.3333333333334" y="1243" class="nt">One retry per guard, then a refusal</text>
<text x="741.3333333333334" y="1269" class="nb">Entity, ingredient consistency and polarity each get one corrective retry</text>
<text x="741.3333333333334" y="1291" class="nb">and one re-check. Fail the same guard twice and the draft is discarded.</text>
<rect x="1406.6666666666667" y="1215" width="653.3333333333334" height="100" rx="4" fill="#F7F9FB" stroke="#D8E0E7" stroke-width="1.4"/>
<text x="1424.6666666666667" y="1243" class="nt">The language is a parameter, not a second step</text>
<text x="1424.6666666666667" y="1269" class="nb">The patient's choice is substituted into rule 7 and the model answers in it</text>
<text x="1424.6666666666667" y="1291" class="nb">directly. Nothing is translated afterwards, so no meaning can drift.</text>
<line x1="40" y1="1350" x2="2060" y2="1350" stroke="#D8E0E7" stroke-width="1.4"/>
<rect x="40.0" y="1368" width="38" height="24" rx="3" fill="#8B99A6" stroke="#6F7C87" stroke-width="1.4"/>
<text x="90.0" y="1386" class="lg">Person</text>
<rect x="328.57142857142856" y="1368" width="38" height="24" rx="3" fill="#1E3A5F" stroke="#16293F" stroke-width="1.4"/>
<text x="378.57142857142856" y="1386" class="lg">Container</text>
<rect x="617.1428571428571" y="1368" width="38" height="24" rx="3" fill="#2A9D8F" stroke="#1F7A6E" stroke-width="1.4"/>
<text x="667.1428571428571" y="1386" class="lg">Component</text>
<rect x="905.7142857142857" y="1368" width="38" height="24" rx="3" fill="#8B99A6" stroke="#D64045" stroke-width="3.5"/>
<text x="955.7142857142857" y="1386" class="lg">External system</text>
<line x1="1194.2857142857142" y1="1380" x2="1228.2857142857142" y2="1380" stroke="#7A8894" stroke-width="2.1" marker-end="url(#ah)"/>
<text x="1244.2857142857142" y="1386" class="lg">Request</text>
<line x1="1482.8571428571427" y1="1380" x2="1516.8571428571427" y2="1380" stroke="#7A8894" stroke-width="2.1" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<text x="1532.8571428571427" y="1386" class="lg">Response</text>
<line x1="1771.4285714285713" y1="1380" x2="1805.4285714285713" y2="1380" stroke="#D64045" stroke-width="2.6" marker-end="url(#ah_red)"/>
<text x="1821.4285714285713" y="1386" class="lg">Leaves our network</text>
<text x="40" y="1442" class="ft">MyPillSafe  ·  Answer Voice, brain 5 of 5  ·  C4 level 3, components  ·  drawn from the shipped code, 2026-08-12</text>
</svg>