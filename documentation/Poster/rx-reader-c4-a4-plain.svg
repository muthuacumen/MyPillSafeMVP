<rect x="1765.0" y="385" width="226.0" height="26.8" fill="#FFFFFF"/>
<text x="1878" y="400.0" class="el">Prompts [HTTP, localhost]</text>
<circle cx="1820" cy="442" r="14" fill="#1E3A5F" stroke="#FFFFFF" stroke-width="2"/>
<text x="1820" y="448" class="bg">6</text>
<polyline points="1960,470 1960,370" fill="none" stroke="#7A8894" stroke-width="2.1" stroke-dasharray="8 6" marker-end="url(#ah_dash)"/>
<rect x="1846.2" y="427" width="183.60000000000002" height="26.8" fill="#FFFFFF"/>
<text x="1938" y="442.0" class="el">medication proposals</text>
