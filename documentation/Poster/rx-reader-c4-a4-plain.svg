<rect width="2100" height="1485" fill="#FFFFFF"/>
<text x="40" y="62" class="ti">Prescription Reader — Component Diagram (C4 level 3)</text>
<text x="40" y="100" class="su">How a photographed pharmacy label becomes an approved medication — and where the local model and the six deterministic guardrails actually sit.</text>
<rect x="440" y="140" width="720" height="1040" rx="5" fill="none" stroke="#9AA4AD" stroke-width="1.6" stroke-dasharray="9 6"/>
<text x="458" y="168" class="bd">Droplet — public internet, mypillsafe.ca</text>
<rect x="1400" y="140" width="660" height="1040" rx="5" fill="none" stroke="#9AA4AD" stroke-width="1.6" stroke-dasharray="9 6"/>
<text x="1418" y="168" class="bd">Brains Host — private network, GPU, never public</text>
<rect x="40" y="380" width="200" height="250" rx="4" fill="#8B99A6" stroke="#6F7C87" stroke-width="1.8"/>
<text x="140.0" y="454.0" class="nm">Patient</text>
<text x="140.0" y="487.0" class="tp">[Person]</text>
<text x="140.0" y="514.0" class="ds">Photographs the</text>
<text x="140.0" y="535.0" class="ds">label; approves</text>
<text x="140.0" y="556.0" class="ds">or edits every</text>
<text x="140.0" y="577.0" class="ds">proposal</text>
<rect x="460" y="195" width="680" height="715" rx="4" fill="#1E3A5F" stroke="#16293F" stroke-width="1.8"/>
<text x="800.0" y="227" class="nm">API</text>
<text x="800.0" y="260" class="tp">[Container: FastAPI, Python]</text>
<text x="800.0" y="287" class="ds">Orchestrates the scan and owns every deterministic safety rule</text>
<rect x="460" y="950" width="330" height="185" rx="4" fill="#1E3A5F" stroke="#16293F" stroke-width="1.8"/>
<text x="625.0" y="1012.5" class="nm">Photo Store</text>
<text x="625.0" y="1045.5" class="tp">[Container: file volume]</text>
<text x="625.0" y="1072.5" class="ds">The prescription photo,</text>
<text x="625.0" y="1093.5" class="ds">kept for your review</text>
<path d="M810,968 a165.0,18 0 0 1 330,0 v149 a165.0,18 0 0 1 -330,0 z" fill="#1E3A5F" stroke="#16293F" stroke-width="1.8"/>
<path d="M810,968 a165.0,18 0 0 0 330,0" fill="none" stroke="#43617F" stroke-width="1.8"/>
<text x="975.0" y="1033.5" class="nm">Database</text>
<text x="975.0" y="1066.5" class="tp">[Container: PostgreSQL]</text>
<text x="975.0" y="1093.5" class="ds">Proposals stored as pending,</text>
<text x="975.0" y="1114.5" class="ds">with proposer and flags</text>
<rect x="1420" y="195" width="620" height="175" rx="4" fill="#1E3A5F" stroke="#16293F" stroke-width="1.8"/>
<text x="1730.0" y="252.5" class="nm">Brains Service</text>
<text x="1730.0" y="285.5" class="tp">[Container: FastAPI, Python]</text>
<text x="1730.0" y="312.5" class="ds">Private entry point on the ML tier —</text>
<text x="1730.0" y="333.5" class="ds">POST /ocr/prescription  ·  POST /rx/extract</text>
<rect x="1420" y="470" width="290" height="330" rx="4" fill="#1E3A5F" stroke="#E09B3D" stroke-width="4"/>
<text x="1565.0" y="571.0" class="nm">Prescription</text>
<text x="1565.0" y="599.0" class="nm">OCR Worker</text>
<text x="1565.0" y="632.0" class="tp">[Container: PaddleOCR,</text>
<text x="1565.0" y="651.0" class="tp">torch-free subprocess]</text>
<text x="1565.0" y="678.0" class="ds">Turns the label photo into</text>
<text x="1565.0" y="699.0" class="ds">plain text. Spawned per</text>
<text x="1565.0" y="720.0" class="ds">scan; one pass, no re-read.</text>
<rect x="1750" y="470" width="290" height="330" rx="4" fill="#1E3A5F" stroke="#16293F" stroke-width="1.8"/>
<text x="1895.0" y="571.0" class="nm">Local Language</text>
<text x="1895.0" y="599.0" class="nm">Model</text>
<text x="1895.0" y="632.0" class="tp">[Container: Ollama,</text>
<text x="1895.0" y="651.0" class="tp">qwen2.5:7b-instruct]</text>
<text x="1895.0" y="678.0" class="ds">Proposes medications from</text>
<text x="1895.0" y="699.0" class="ds">the label text. Runs on our</text>
<text x="1895.0" y="720.0" class="ds">own hardware — no cloud.</text>
<path d="M1420,958 a310.0,18 0 0 1 620,0 v154 a310.0,18 0 0 1 -620,0 z" fill="#1E3A5F" stroke="#16293F" stroke-width="1.8"/>
<path d="M1420,958 a310.0,18 0 0 0 620,0" fill="none" stroke="#43617F" stroke-width="1.8"/>
<text x="1730.0" y="1026.0" class="nm">Reference Data</text>
<text x="1730.0" y="1059.0" class="tp">[Data store: DIN reference workbook]</text>
<text x="1730.0" y="1086.0" class="ds">11,609 marketed Canadian DINs — G1's catalog check</text>
<text x="1730.0" y="1107.0" class="ds">and the DIN suggestions offered for confirmation</text>
<rect x="480" y="295" width="311" height="165" rx="4" fill="#2A9D8F" stroke="#1F7A6E" stroke-width="1.8"/>
<text x="635.5" y="337.0" class="cn">Scan Orchestrator</text>
<text x="635.5" y="366.0" class="ct">[Component: POST /prescriptions]</text>
<text x="635.5" y="392.0" class="cd">Saves the photo, calls OCR,</text>
<text x="635.5" y="412.0" class="cd">then asks the local model</text>
<text x="635.5" y="432.0" class="cd">to propose the medications</text>
<rect x="809" y="295" width="311" height="165" rx="4" fill="#2A9D8F" stroke="#1F7A6E" stroke-width="1.8"/>
<text x="964.5" y="337.0" class="cn">Regex Proposer</text>
<text x="964.5" y="366.0" class="ct">[Component: prescription_parser]</text>
<text x="964.5" y="392.0" class="cd">Deterministic fallback, used</text>
<text x="964.5" y="412.0" class="cd">only when the model cannot</text>
<text x="964.5" y="432.0" class="cd">be reached</text>
<rect x="480" y="490" width="640" height="235" rx="4" fill="#2A9D8F" stroke="#1F7A6E" stroke-width="1.8"/>
<text x="800.0" y="537.0" class="cn">Rx Guardrails  ·  G1 to G6</text>
<text x="800.0" y="566.0" class="ct">[Component: deterministic rules, no model involved]</text>
<text x="500" y="592.0" class="cl">G1  catalog — a name absent from the DIN reference is flagged</text>
<text x="500" y="612.0" class="cl">G2  no-invention — unprinted time stripped, unprinted name flagged</text>
<text x="500" y="632.0" class="cl">G3  schema — a frequency outside the enum becomes UNKNOWN</text>
<text x="500" y="652.0" class="cl">G4  derivation — reminder times come from a fixed table, here</text>
<text x="500" y="672.0" class="cl">G5  conflict — duplicate names or disagreeing strengths flagged</text>
<text x="500" y="692.0" class="cl">G6  as-needed — read from the LABEL, never from the proposal</text>
<rect x="480" y="750" width="435" height="140" rx="4" fill="#2A9D8F" stroke="#1F7A6E" stroke-width="1.8"/>
<text x="697.5" y="789.5" class="cn">Approval Gate</text>
<text x="697.5" y="818.5" class="ct">[Component: PATCH /prescriptions/{id}]</text>
<text x="697.5" y="844.5" class="cd">Blocking flags must be resolved or confirmed</text>
<text x="697.5" y="864.5" class="cd">before a proposal becomes a medication</text>
