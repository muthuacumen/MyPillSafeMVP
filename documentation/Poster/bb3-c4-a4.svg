<text x="847.5" y="1411" class="lg">Data store</text>
<rect x="1050.0" y="1393" width="38" height="24" rx="3" fill="#8B99A6" stroke="#D64045" stroke-width="3.5"/>
<text x="1100.0" y="1411" class="lg">External system</text>
<line x1="1302.5" y1="1405" x2="1336.5" y2="1405" stroke="#7A8894" stroke-width="2.1" marker-end="url(#ah)"/>
<text x="1352.5" y="1411" class="lg">Request</text>
<line x1="1555.0" y1="1405" x2="1589.0" y2="1405" stroke="#7A8894" stroke-width="2.1" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<text x="1605.0" y="1411" class="lg">Response</text>
<line x1="1807.5" y1="1405" x2="1841.5" y2="1405" stroke="#D64045" stroke-width="2.6" marker-end="url(#ah_red)"/>
<text x="1857.5" y="1411" class="lg">Leaves our network</text>
<text x="40" y="1467" class="ft">MyPillSafe  ·  Monograph Retrieval, brain 4 of 5, with the Answer Voice  ·  C4 level 3, components  ·  drawn from the shipped code, 2026-08-12</text>
</svg>