<rect width="2100" height="1485" fill="#FFFFFF"/>
<text x="40" y="62" class="ti">Monograph Retrieval (BB3) — Component Diagram (C4 level 3)</text>
<text x="40" y="100" class="su">How a medication question is resolved, scoped, retrieved and guarded — and the single hop that leaves our network.</text>
<rect x="420" y="125" width="490" height="690" rx="5" fill="none" stroke="#9AA4AD" stroke-width="1.6" stroke-dasharray="9 6"/>
<text x="438" y="153" class="bd">Droplet — public internet, mypillsafe.ca</text>
<rect x="1150" y="125" width="910" height="1045" rx="5" fill="none" stroke="#9AA4AD" stroke-width="1.6" stroke-dasharray="9 6"/>
<text x="1168" y="153" class="bd">Brains Host — private network, GPU, never public</text>
<rect x="40" y="330" width="190" height="250" rx="4" fill="#8B99A6" stroke="#6F7C87" stroke-width="1.8"/>
<text x="135.0" y="404.0" class="nm">Patient</text>
<text x="135.0" y="437.0" class="tp">[Person]</text>
<text x="135.0" y="464.0" class="ds">Asks about a</text>
<text x="135.0" y="485.0" class="ds">medication, in</text>
<text x="135.0" y="506.0" class="ds">their own</text>
<text x="135.0" y="527.0" class="ds">language</text>
<rect x="440" y="180" width="450" height="600" rx="4" fill="#1E3A5F" stroke="#16293F" stroke-width="1.8"/>
<text x="665.0" y="212" class="nm">API</text>
<text x="665.0" y="245" class="tp">[Container: FastAPI, Python]</text>
<text x="665.0" y="272" class="ds">Owns the Q&amp;A route and the only cloud key</text>
<rect x="440" y="880" width="450" height="200" rx="4" fill="#8B99A6" stroke="#D64045" stroke-width="4"/>
<text x="665.0" y="917.5" class="nm">Claude API</text>
<text x="665.0" y="950.5" class="tp">[External system: Anthropic,</text>
<text x="665.0" y="969.5" class="tp">claude-haiku-4-5]</text>
<text x="665.0" y="996.5" class="ds">Phrases the final answer from the</text>
<text x="665.0" y="1017.5" class="ds">passages it is handed. Decides nothing.</text>
<text x="665.0" y="1048.5" class="an">The only cloud call in MyPillSafe: no identity,</text>
<text x="665.0" y="1066.5" class="an">no medication profile and no photo cross this line.</text>
<rect x="1170" y="180" width="870" height="680" rx="4" fill="#1E3A5F" stroke="#16293F" stroke-width="1.8"/>
<text x="1605.0" y="212" class="nm">Brains Service</text>
<text x="1605.0" y="245" class="tp">[Container: FastAPI, Python]</text>
<text x="1605.0" y="272" class="ds">Hosts the frozen BB3 package — POST /qa/chat  ·  POST /qa/guard</text>
<path d="M1170,928 a220.0,18 0 0 1 440,0 v204 a220.0,18 0 0 1 -440,0 z" fill="#1E3A5F" stroke="#16293F" stroke-width="1.8"/>
<path d="M1170,928 a220.0,18 0 0 0 440,0" fill="none" stroke="#43617F" stroke-width="1.8"/>
<text x="1390.0" y="976.0" class="nm">Monograph Store</text>
<text x="1390.0" y="1009.0" class="tp">[Data store: SQLite FTS5</text>
<text x="1390.0" y="1028.0" class="tp">+ memory-mapped vectors]</text>
<text x="1390.0" y="1055.0" class="ds">6,803 Health Canada monographs</text>
<text x="1390.0" y="1076.0" class="ds">and 27 ingredient references —</text>
<text x="1390.0" y="1097.0" class="ds">3.9 million searchable passages</text>
<text x="1390.0" y="1128.0" class="an">Memory-mapped, never loaded whole.</text>
<rect x="1630" y="910" width="410" height="240" rx="4" fill="#1E3A5F" stroke="#16293F" stroke-width="1.8"/>
<text x="1835.0" y="935.5" class="nm">Local Language</text>
<text x="1835.0" y="963.5" class="nm">Model</text>
<text x="1835.0" y="996.5" class="tp">[Container: Ollama,</text>
<text x="1835.0" y="1015.5" class="tp">qwen2.5:7b-instruct]</text>
<text x="1835.0" y="1042.5" class="ds">BB3's own generator, used only</text>
<text x="1835.0" y="1063.5" class="ds">when no cloud key is configured.</text>
<text x="1835.0" y="1094.5" class="an">Kept as the offline fallback and the</text>
<text x="1835.0" y="1112.5" class="an">evaluation harness — not the production</text>
<text x="1835.0" y="1130.5" class="an">voice: it once answered the opposite of</text>
<text x="1835.0" y="1148.5" class="an">a contraindication it had itself cited.</text>
<rect x="460" y="285" width="410" height="190" rx="4" fill="#2A9D8F" stroke="#1F7A6E" stroke-width="1.8"/>
<text x="665.0" y="316.5" class="cn">Q&amp;A Route</text>
<text x="665.0" y="345.5" class="ct">[Component: POST /api/v1/qa/chat]</text>
<text x="665.0" y="371.5" class="cd">Patient-scoped. Carries the DIN of a</text>
<text x="665.0" y="391.5" class="cd">medication the patient already</text>
<text x="665.0" y="411.5" class="cd">confirmed, when they picked one.</text>
<text x="665.0" y="441.5" class="anc">Chooses the cloud voice when a key is</text>
<text x="665.0" y="459.5" class="anc">configured, the offline one when not.</text>
<rect x="460" y="505" width="410" height="245" rx="4" fill="#2A9D8F" stroke="#1F7A6E" stroke-width="1.8"/>
<text x="665.0" y="555.0" class="cn">CB4 Answer Voice</text>
<text x="665.0" y="584.0" class="ct">[Component: cb4_service]</text>
<text x="665.0" y="610.0" class="cd">Sends BB3's packed passages to the</text>
<text x="665.0" y="630.0" class="cd">cloud model, then puts the answer</text>
<text x="665.0" y="650.0" class="cd">back through BB3's guards.</text>
<text x="665.0" y="680.0" class="anc">One corrective retry per violation,</text>
<text x="665.0" y="698.0" class="anc">then a hard refusal. The only place</text>
<text x="665.0" y="716.0" class="anc">in the system an API key exists.</text>
<rect x="1190" y="285" width="830" height="145" rx="4" fill="#2A9D8F" stroke="#1F7A6E" stroke-width="1.8"/>
<text x="1605.0" y="313.0" class="cn">Resolver</text>
<text x="1605.0" y="342.0" class="ct">[Component: bb3.resolver — the only door into retrieval]</text>
<text x="1605.0" y="368.0" class="cd">Free text, brand, ingredient or DIN → a resolved set of Canadian DINs. If it cannot, it asks:</text>
<text x="1605.0" y="388.0" class="cd">one near-match → confirm, more than one → pick_list, never auto-picked; none → not_found.</text>
<text x="1605.0" y="418.0" class="anc">Fuzzy threshold 80 on words of six characters or more. A DIN the app already holds skips this stage.</text>
<rect x="1190" y="460" width="395" height="180" rx="4" fill="#2A9D8F" stroke="#1F7A6E" stroke-width="1.8"/>
<text x="1387.5" y="476.5" class="cn">Scoped Retrieval</text>
<text x="1387.5" y="505.5" class="ct">[Component: bb3.retrieve + bb3.intent]</text>
<text x="1387.5" y="531.5" class="cd">Hybrid dense + lexical search, RRF-</text>
<text x="1387.5" y="551.5" class="cd">fused, over the resolved DINs'</text>
<text x="1387.5" y="571.5" class="cd">passages and nothing else. Intent</text>
<text x="1387.5" y="591.5" class="cd">routes to the right sections.</text>
<text x="1387.5" y="621.5" class="anc">There is no full-corpus path in this</text>
<text x="1387.5" y="639.5" class="anc">package: it was deleted, not disabled.</text>
<rect x="1625" y="460" width="395" height="180" rx="4" fill="#2A9D8F" stroke="#1F7A6E" stroke-width="1.8"/>
<text x="1822.5" y="476.5" class="cn">Enumeration</text>
<text x="1822.5" y="505.5" class="ct">[Component: bb3.enumerate]</text>
<text x="1822.5" y="531.5" class="cd">“Which products contain</text>
<text x="1822.5" y="551.5" class="cd">acetaminophen?” is answered by SQL</text>
<text x="1822.5" y="571.5" class="cd">over the formulary and returns</text>
<text x="1822.5" y="591.5" class="cd">immediately — no model involved.</text>
<text x="1822.5" y="621.5" class="anc">A deterministic list, with the</text>
<text x="1822.5" y="639.5" class="anc">excluded count always stated.</text>
<rect x="1190" y="670" width="395" height="170" rx="4" fill="#2A9D8F" stroke="#1F7A6E" stroke-width="1.8"/>
<text x="1387.5" y="681.5" class="cn">Dosing Gate &amp; Packing</text>
<text x="1387.5" y="710.5" class="ct">[Component: bb3.engine rules]</text>
<text x="1387.5" y="736.5" class="cd">Refuses a dosing question when every</text>
<text x="1387.5" y="756.5" class="cd">surviving source is a generated</text>
<text x="1387.5" y="776.5" class="cd">ingredient reference, then packs the</text>
<text x="1387.5" y="796.5" class="cd">rest with their source tags.</text>
<text x="1387.5" y="826.5" class="anc">A hard gate: on refusal no model</text>
<text x="1387.5" y="844.5" class="anc">is called at all.</text>
<rect x="1625" y="670" width="395" height="170" rx="4" fill="#2A9D8F" stroke="#1F7A6E" stroke-width="1.8"/>
<text x="1822.5" y="681.5" class="cn">Generation Guards</text>
<text x="1822.5" y="710.5" class="ct">[Component: bb3.guards]</text>
<text x="1822.5" y="736.5" class="cd">Run on the answer that comes back:</text>
<text x="1822.5" y="756.5" class="cd">entity · ingredient-consistency ·</text>
<text x="1822.5" y="776.5" class="cd">structured abstention · claim-source</text>
<text x="1822.5" y="796.5" class="cd">polarity.</text>
<text x="1822.5" y="826.5" class="anc">Single-shot here — the API owns the</text>
<text x="1822.5" y="844.5" class="anc">retry loop.</text>
<polyline points="230,360 440,360" fill="none" stroke="#7A8894" stroke-width="2.1" marker-end="url(#ah)"/>
<rect x="264.4" y="293" width="141.2" height="47.6" fill="#FFFFFF"/>
<text x="335" y="308.0" class="el">Asks a question</text>
<text x="335" y="328.8" class="el">[HTTPS]</text>
<circle cx="262" cy="360" r="14" fill="#1E3A5F" stroke="#FFFFFF" stroke-width="2"/>
<text x="262" y="366" class="bg">1</text>
<polyline points="440,440 230,440" fill="none" stroke="#7A8894" stroke-width="2.1" marker-end="url(#ah)"/>
<rect x="251.68" y="373" width="166.64000000000001" height="47.6" fill="#FFFFFF"/>
<text x="335" y="388.0" class="el">The answer, cited,</text>
<text x="335" y="408.8" class="el">in their language</text>
<circle cx="408" cy="440" r="14" fill="#1E3A5F" stroke="#FFFFFF" stroke-width="2"/>
<text x="408" y="446" class="bg">7</text>
<polyline points="890,290 1170,290" fill="none" stroke="#7A8894" stroke-width="2.1" marker-end="url(#ah)"/>
<rect x="967.88" y="223" width="124.24000000000001" height="47.6" fill="#FFFFFF"/>
<text x="1030" y="238.0" class="el">POST /qa/chat</text>
<text x="1030" y="258.8" class="el">mode=context</text>
<circle cx="922" cy="290" r="14" fill="#1E3A5F" stroke="#FFFFFF" stroke-width="2"/>
<text x="922" y="296" class="bg">2</text>
<polyline points="1170,385 890,385" fill="none" stroke="#7A8894" stroke-width="2.1" stroke-dasharray="8 6" marker-end="url(#ah)"/>
<rect x="912.76" y="315" width="234.48000000000002" height="68.4" fill="#FFFFFF"/>
<text x="1030" y="330.0" class="el">context_ready: the packed,</text>
<text x="1030" y="350.8" class="el">cited passages — or a</text>
<text x="1030" y="371.6" class="el">short-circuit answer</text>
<polyline points="665,475 665,505" fill="none" stroke="#9FB6CC" stroke-width="1.7" marker-end="url(#ah_inner)"/>
<rect x="602.88" y="482" width="124.24000000000001" height="26.8" fill="#1E3A5F"/>
<text x="665" y="497.0" class="eli">context_ready</text>
<polyline points="610,750 610,880" fill="none" stroke="#D64045" stroke-width="2.6" marker-end="url(#ah_red)"/>
<rect x="704.72" y="785" width="200.56" height="68.4" fill="#FFFFFF"/>
<text x="805" y="800.0" class="elr">Question + retrieved</text>
<text x="805" y="820.8" class="elr">passages only [HTTPS];</text>
<text x="805" y="841.6" class="elr">answer JSON back</text>
<circle cx="610" cy="845" r="14" fill="#D64045" stroke="#FFFFFF" stroke-width="2"/>
<text x="610" y="851" class="bg">5</text>
<polyline points="690,880 690,750" fill="none" stroke="#D64045" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#ah_red)"/>
<polyline points="890,600 1170,600" fill="none" stroke="#7A8894" stroke-width="2.1" marker-end="url(#ah)"/>
<rect x="933.96" y="533" width="192.08" height="47.6" fill="#FFFFFF"/>
<text x="1030" y="548.0" class="el">POST /qa/guard —</text>
<text x="1030" y="568.8" class="el">BB3 checks the answer</text>
<circle cx="922" cy="600" r="14" fill="#1E3A5F" stroke="#FFFFFF" stroke-width="2"/>
<text x="922" y="606" class="bg">6</text>
<polyline points="1170,680 890,680" fill="none" stroke="#7A8894" stroke-width="2.1" stroke-dasharray="8 6" marker-end="url(#ah)"/>
<rect x="942.44" y="643" width="175.12" height="26.8" fill="#FFFFFF"/>
<text x="1030" y="658.0" class="el">violations, or none</text>
<polyline points="1387,430 1387,460" fill="none" stroke="#9FB6CC" stroke-width="1.7" marker-end="url(#ah_inner)"/>
<rect x="1350.32" y="437" width="73.36" height="26.8" fill="#1E3A5F"/>
<text x="1387" y="452.0" class="eli">DIN set</text>
<circle cx="1305" cy="445" r="14" fill="#1E3A5F" stroke="#FFFFFF" stroke-width="2"/>
<text x="1305" y="451" class="bg">3</text>
<polyline points="1822,430 1822,460" fill="none" stroke="#9FB6CC" stroke-width="1.7" marker-end="url(#ah_inner)"/>
<rect x="1768.36" y="437" width="107.28" height="26.8" fill="#1E3A5F"/>
<text x="1822" y="452.0" class="eli">list intent</text>
<polyline points="1387,640 1387,670" fill="none" stroke="#9FB6CC" stroke-width="1.7" marker-end="url(#ah_inner)"/>
<polyline points="1250,860 1250,910" fill="none" stroke="#7A8894" stroke-width="2.1" marker-end="url(#ah)"/>
<rect x="1281.88" y="875" width="336.24" height="26.8" fill="#FFFFFF"/>
<text x="1450" y="890.0" class="el">Reads only the resolved DINs' passages</text>
<circle cx="1250" cy="885" r="14" fill="#1E3A5F" stroke="#FFFFFF" stroke-width="2"/>
<text x="1250" y="891" class="bg">4</text>
<polyline points="1830,860 1830,910" fill="none" stroke="#7A8894" stroke-width="2.1" marker-end="url(#ah)"/>
<rect x="1623.72" y="875" width="412.56" height="26.8" fill="#FFFFFF"/>
<text x="1830" y="890.0" class="el">Offline fallback only — no cloud key configured</text>
<rect x="40.0" y="1205" width="653.3333333333334" height="135" rx="4" fill="#F7F9FB" stroke="#D8E0E7" stroke-width="1.4"/>
<text x="58.0" y="1235" class="nt">Resolve first, retrieve second</text>
<text x="58.0" y="1261" class="nb">The resolver is the only door: retrieval is always scoped to a resolved</text>
<text x="58.0" y="1283" class="nb">DIN set. When it cannot resolve the question it asks — confirm, pick_list</text>
<text x="58.0" y="1305" class="nb">or not_found — and no model runs at all.</text>
<rect x="723.3333333333334" y="1205" width="653.3333333333334" height="135" rx="4" fill="#F7F9FB" stroke="#D8E0E7" stroke-width="1.4"/>
<text x="741.3333333333334" y="1235" class="nt">BB3 retrieves and guards; it does not speak</text>
<text x="741.3333333333334" y="1261" class="nb">The local model stays as the offline fallback and the evaluation harness.</text>
<text x="741.3333333333334" y="1283" class="nb">The production voice is a cloud model, and BB3's guards run on its answer</text>
<text x="741.3333333333334" y="1305" class="nb">exactly as they ran on the local one's.</text>
<rect x="1406.6666666666667" y="1205" width="653.3333333333334" height="135" rx="4" fill="#F7F9FB" stroke="#D8E0E7" stroke-width="1.4"/>
<text x="1424.6666666666667" y="1235" class="nt">One hop leaves our network, and only one</text>
<text x="1424.6666666666667" y="1261" class="nb">It carries the question and the passages BB3 already retrieved — no</text>
<text x="1424.6666666666667" y="1283" class="nb">identity, no medication profile, no photo. Everything else on this page</text>
<text x="1424.6666666666667" y="1305" class="nb">runs on hardware the project owns.</text>
<line x1="40" y1="1375" x2="2060" y2="1375" stroke="#D8E0E7" stroke-width="1.4"/>
<rect x="40.0" y="1393" width="38" height="24" rx="3" fill="#8B99A6" stroke="#6F7C87" stroke-width="1.4"/>
<text x="90.0" y="1411" class="lg">Person</text>
<rect x="292.5" y="1393" width="38" height="24" rx="3" fill="#1E3A5F" stroke="#16293F" stroke-width="1.4"/>
<text x="342.5" y="1411" class="lg">Container</text>
<rect x="545.0" y="1393" width="38" height="24" rx="3" fill="#2A9D8F" stroke="#1F7A6E" stroke-width="1.4"/>
<text x="595.0" y="1411" class="lg">Component</text>
